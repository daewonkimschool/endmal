<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 온라인 끝말잇기</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --primary: #0050ff;
            --primary-hover: #0040d0;
            --bg: #f9fafb;
            --card-bg: #ffffff;
            --text: #191f28;
            --text-secondary: #8b95a1;
            --border: #e5e8eb;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 440px; padding: 20px; }
        .card { background: var(--card-bg); border-radius: 20px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; text-align: center; }
        p.subtitle { font-size: 14px; color: var(--text-secondary); text-align: center; margin-bottom: 24px; }
        .input-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: var(--text-secondary); }
        input[type="text"] { width: 100%; padding: 14px 16px; border: 1.5px solid var(--border); border-radius: 12px; font-size: 16px; outline: none; transition: border-color 0.2s; }
        input[type="text"]:focus { border-color: var(--primary); }
        button { width: 100%; padding: 14px; background-color: var(--primary); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background-color 0.2s; }
        button:hover { background-color: var(--primary-hover); }
        .hidden { display: none !important; }
        .status-box { background: var(--bg); border-radius: 12px; padding: 16px; margin-bottom: 16px; text-align: center; }
        .current-word { font-size: 28px; font-weight: 800; color: var(--primary); margin: 8px 0; }
        .history-box { max-height: 150px; overflow-y: auto; border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 16px; background: #fff; }
        .history-item { font-size: 14px; padding: 4px 0; border-bottom: 1px solid #f1f3f5; }
        .alert { color: #e53e3e; font-size: 13px; text-align: center; margin-top: 8px; height: 18px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- 로비 화면 -->
        <div id="lobby-screen" class="card">
            <h1>실시간 끝말잇기</h1>
            <p class="subtitle">친구와 함께 즐기는 웹 멀티플레이어</p>
            <div class="input-group">
                <label for="room-input">방 코드 입력</label>
                <input type="text" id="room-input" placeholder="예: room123">
            </div>
            <button id="join-btn">참여하기 / 방 만들기</button>
            <div id="lobby-alert" class="alert"></div>
        </div>

        <!-- 게임 화면 -->
        <div id="game-screen" class="card hidden">
            <h1>끝말잇기 대결</h1>
            <div class="status-box">
                <div id="turn-status" style="font-size: 14px; font-weight: 600; color: var(--text-secondary);">대기 중...</div>
                <div class="current-word" id="current-word-display">시작 전</div>
            </div>
            <div class="history-box" id="history-box"></div>
            <div class="input-group">
                <input type="text" id="word-input" placeholder="단어를 입력하세요" autocomplete="off">
            </div>
            <button id="send-btn">입력하기</button>
            <div id="game-alert" class="alert"></div>
        </div>
    </div>

    <script>
        const socket = io();

        const lobbyScreen = document.getElementById('lobby-screen');
        const gameScreen = document.getElementById('game-screen');
        const roomInput = document.getElementById('room-input');
        const joinBtn = document.getElementById('join-btn');
        const lobbyAlert = document.getElementById('lobby-alert');

        const turnStatus = document.getElementById('turn-status');
        const currentWordDisplay = document.getElementById('current-word-display');
        const historyBox = document.getElementById('history-box');
        const wordInput = document.getElementById('word-input');
        const sendBtn = document.getElementById('send-btn');
        const gameAlert = document.getElementById('game-alert');

        let myId = '';

        socket.on('connect', () => { myId = socket.id; });

        joinBtn.addEventListener('click', () => {
            const roomCode = roomInput.value.trim();
            if (!roomCode) {
                lobbyAlert.textContent = '방 코드를 입력해주세요!';
                return;
            }
            socket.emit('join_room', roomCode);
        });

        socket.on('room_full', () => { lobbyAlert.textContent = '방이 꽉 찼습니다! (최대 2명)'; });

        socket.on('room_update', (data) => {
            lobbyScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            updateGameUI(data);
        });

        socket.on('update_game', (data) => {
            updateGameUI(data);
            gameAlert.textContent = '';
            wordInput.value = '';
        });

        socket.on('error_msg', (msg) => { gameAlert.textContent = msg; });

        socket.on('player_left', () => {
            gameAlert.textContent = '상대방이 나갔습니다.';
            turnStatus.textContent = '게임 중단';
        });

        sendBtn.addEventListener('click', submitWord);
        wordInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') submitWord(); });

        function submitWord() {
            const word = wordInput.value.trim();
            if (!word) return;
            socket.emit('submit_word', word);
        }

        function updateGameUI(data) {
            currentWordDisplay.textContent = data.currentWord || '첫 단어를 입력하세요!';

            if (data.turn === myId) {
                turnStatus.textContent = '🔥 내 차례입니다!';
                turnStatus.style.color = 'var(--primary)';
            } else {
                turnStatus.textContent = '⏳ 상대방 차례입니다...';
                turnStatus.style.color = 'var(--text-secondary)';
            }

            historyBox.innerHTML = '';
            data.history.forEach(word => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.textContent = word;
                historyBox.appendChild(div);
            });
            historyBox.scrollTop = historyBox.scrollHeight;
        }
    </script>
</body>
</html>
